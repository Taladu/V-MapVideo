name: Fix Vietnam geocoder focus

on:
  push:
    paths:
      - '.github/workflows/fix-vietnam-geocoder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch A B search to Vietnam
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "directions = new MapboxDirections({ accessToken: mapboxgl.accessToken, unit: 'metric', profile: 'mapbox/driving', controls: { instructions: true, profileSwitcher: false } });"
          new = "directions = new MapboxDirections({ accessToken: mapboxgl.accessToken, unit: 'metric', profile: 'mapbox/driving', language: 'vi', geocoder: { countries: 'vn', proximity: { longitude: 106.700981, latitude: 10.776530 }, bbox: [102.14441, 8.17966, 109.46917, 23.39340] }, controls: { instructions: true, profileSwitcher: false } });"
          if old not in text:
              raise SystemExit('Expected MapboxDirections initialization was not found; no changes made.')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one MapboxDirections initialization; no changes made.')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Commit focused geocoder fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Focus A B search on Vietnam"
          git push
