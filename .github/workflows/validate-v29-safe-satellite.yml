name: Validate V29.3 Safe Satellite Preload

on:
  push:
    branches:
      - v29-safe-satellite-layer\n      - v29.3-safe-satellite-preload
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check gps-route-overlay.js
          node --check script.js
          node --check satellite-layer-toggle.js
          node --check mapbox-token-runtime.js
          node --check gps-video-library.js
          node --check exact-ab-reverse-regression.test.cjs
          node --check satellite-layer-toggle.test.cjs
          node --check mapbox-token-safety.test.cjs
          node --check v29.3-golden-style.test.cjs
          node --check v28-safe-dual-geometry.test.cjs
          node --check v28-safe-hit-layer.test.cjs
          node --check v28-safe-library-priority.test.cjs
          node --check v28-route-event-geometry.test.cjs

      - name: Validate JSON data
        shell: bash
        run: |
          node -e "for (const f of ['places.json','route-video-library.json','route-videos.json','route-videos-TEST-CHIEU-DI-A-B.json','route-videos-TEST-CHIEU-VE-B-A.json','route-videos-test-tu-ong-a-b-a-b.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('PASS JSON')"

      - name: Lock Golden V19 data blobs
        shell: bash
        run: |
          test "$(git hash-object route-videos.json)" = "4e9d63ccfa15bced6eeb270bb8ee14acf0b8785e"
          test "$(git hash-object route-videos-TEST-CHIEU-DI-A-B.json)" = "5bca70719897adb83668b190d2790bd4ca376fdc"
          test "$(git hash-object route-videos-TEST-CHIEU-VE-B-A.json)" = "74f7a580be488337c0de98d6986a39f0e38a60ea"
          test "$(git hash-object route-videos-test-tu-ong-a-b-a-b.json)" = "b60df2136f36448754b3c0612d8e948581b97b51"
          test "$(git hash-object route-video-library.json)" = "f01926102101db35ca590e08e08fe089f6768403"
          echo "PASS Golden V19 data blobs unchanged"

      - name: Lock V29.2 core code
        shell: bash
        run: |
          test "$(git hash-object script.js)" = "7e354d1dc96ca208500d67a9c54a5d9c41083dd0"
          test "$(git hash-object gps-route-overlay.js)" = "c816f293638f3000c830b00a9b9c6bb22bb2a583"
          test "$(git hash-object gps-video-library.js)" = "68899332ee5ceadc43e52ad906ceca8fd761b5b5"
          test "$(git hash-object vmap-runtime-bridge.js)" = "9907e62e8e47bdc64680097a72262cf21ec3f16f"
          test "$(git hash-object exact-ab-reverse-regression.test.cjs)" = "5afcbede9e14f431645434e787da71f5b58bf1b6"
          echo "PASS V29.2 core code unchanged"

      - name: Run regression tests
        shell: bash
        run: |
          node exact-ab-reverse-regression.test.cjs
          node v28-safe-hit-layer.test.cjs
          node v28-safe-library-priority.test.cjs
          node v28-route-event-geometry.test.cjs
          node v28-safe-dual-geometry.test.cjs
          node satellite-layer-toggle.test.cjs
          node mapbox-token-safety.test.cjs
          node v29.3-golden-style.test.cjs

      - name: Write build info
        shell: bash
        run: |
          printf '{"commitSha":"%s","ref":"%s","build":"v29.3-safe-satellite-preload"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > build-info.json

      - name: Package V29 Safe Satellite Layer
        shell: bash
        run: |
          zip -r V-MapVideo-CLEAN-29.3-safe-satellite-preload.zip . \
            -x '.git/*' 'V-MapVideo-CLEAN-29.3-safe-satellite-preload.zip'

      - name: Upload V29 Safe Satellite Layer
        uses: actions/upload-artifact@v4
        with:
          name: V-MapVideo-CLEAN-29.3-safe-satellite-preload
          path: V-MapVideo-CLEAN-29.3-safe-satellite-preload.zip
          if-no-files-found: error
          retention-days: 30
